# Open-source LiteLLM proxy config (Python) for Cloud Run
# Clients:
#   OpenAI SDK  → /v1/chat/completions
#   Anthropic / Claude agent → /v1/messages  (LiteLLM converts)
# Auth: custom_auth.py → Tokyo JWT → NA /v1/auth/verify
# Upstream Gemini/Claude: Vertex / Agent Platform via ADC (Cloud Run SA)

model_list:
  # ---------- Gemini (Vertex / Agent Platform) ----------
  - model_name: gemini-3.6-flash
    litellm_params:
      model: vertex_ai/gemini-3.6-flash
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/GCP_LOCATION

  - model_name: gemini-3.5-flash
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/GCP_PROJECT
