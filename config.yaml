# LiteLLM-style model routing for Cloud Run
# Vertex providers use GCP ADC (Cloud Run SA) — bills to your GCP free-trial credits.

general_settings:
  master_key_env: LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout_ms: 300000

model_list:
  # =====================================================================
  # Vertex Gemini — USE THESE to spend GCP free-trial / billing credits
  # Env: GCP_PROJECT, GCP_LOCATION (recommend: global), LITELLM_MASTER_KEY
  # Cloud Run SA needs roles/aiplatform.user ; enable aiplatform.googleapis.com
  # =====================================================================
  - model_name: gemini-3.6-flash
    litellm_params:
      provider: vertex_gemini
      model: gemini-3.6-flash

  - model_name: gemini-3.5-flash
    litellm_params:
      provider: vertex_gemini
      model: gemini-3.5-flash

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      provider: vertex_gemini
      model: gemini-3.1-flash-lite-preview

  - model_name: gemini-2.5-flash
    litellm_params:
      provider: vertex_gemini
      model: gemini-2.5-flash

  # Short alias / default → Vertex 3.6 Flash (GCP billing)
  - model_name: gemini-flash
    litellm_params:
      provider: vertex_gemini
      model: gemini-3.6-flash

  - model_name: default
    litellm_params:
      provider: vertex_gemini
      model: gemini-3.6-flash

  # =====================================================================
  # AI Studio Key path (optional) — may use free quota; NOT guaranteed GCP credits
  # Needs GEMINI_API_KEY
  # =====================================================================
  - model_name: gemini-3.6-flash-studio
    litellm_params:
      model: gemini-3.6-flash
      api_base: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GEMINI_API_KEY

  # ---- Claude on Vertex (Model Garden + Cloud Run SA needs roles/aiplatform.user) ----
  # Official global example:
  #   .../publishers/anthropic/models/claude-sonnet-4-5@20250929:streamRawPredict
  - model_name: claude-sonnet
    litellm_params:
      provider: vertex_anthropic
      model: claude-sonnet-4-5@20250929

  - model_name: claude-sonnet-4.5
    litellm_params:
      provider: vertex_anthropic
      model: claude-sonnet-4-5@20250929

  - model_name: claude-sonnet-4-5
    litellm_params:
      provider: vertex_anthropic
      model: claude-sonnet-4-5@20250929

  - model_name: claude-sonnet-direct
    litellm_params:
      provider: anthropic
      model: claude-sonnet-4-5-20250929
      api_base: https://api.anthropic.com
      api_key_env: ANTHROPIC_API_KEY

  # ---- Optional other providers ----
  - model_name: grok-4.5
    litellm_params:
      model: grok-4.5
      api_base: https://api.x.ai/v1
      api_key_env: XAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_base: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
