    litellm_params:
      model: vertex_ai/gemini-3.6-flash
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/GCP_LOCATION

  - model_name: gemini-flash-lite
    litellm_params:
      model: vertex_ai/gemini-3.5-flash-lite
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/GCP_LOCATION

  - model_name: default
    litellm_params:
      model: vertex_ai/gemini-3.6-flash
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/GCP_LOCATION

  # ---------- Claude on Vertex (needs partner quota) ----------
  - model_name: claude-sonnet
    litellm_params:
      model: vertex_ai/claude-sonnet-4-5@20250929
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/GCP_LOCATION

  - model_name: claude-sonnet-4.5
    litellm_params:
      model: vertex_ai/claude-sonnet-4-5@20250929
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/GCP_LOCATION

  - model_name: claude-sonnet-4-5
    litellm_params:
      model: vertex_ai/claude-sonnet-4-5@20250929
      vertex_project: os.environ/GCP_PROJECT
      vertex_location: os.environ/GCP_LOCATION

  # Direct Anthropic (needs ANTHROPIC_API_KEY on Cloud Run)
  - model_name: claude-sonnet-direct
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 300
  # Helpful when clients send extra OpenAI/Anthropic fields
  modify_params: true

general_settings:
  # Tokyo access_token or optional master key — see custom_auth.py
  custom_auth: custom_auth.user_api_key_auth
  # Optional break-glass (also checked inside custom_auth)
  master_key: os.environ/LITELLM_MASTER_KEY
